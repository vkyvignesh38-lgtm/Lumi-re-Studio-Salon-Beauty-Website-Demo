<li class="price-row">
  <div class="price-row__main">
    <span class="price-row__name">{{ name }}</span>
    <span class="price-row__detail">{{ detail }}</span>
  </div>
  <span class="price-row__dots" aria-hidden="true"></span>
  <span class="price-row__duration"><svg class="icon" aria-hidden="true"><use href="#i-clock"/></svg>{{ duration }}</span>
  <span class="price-row__price">{{ price }}</span>
</li>
