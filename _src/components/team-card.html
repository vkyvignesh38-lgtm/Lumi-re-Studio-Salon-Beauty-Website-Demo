<article class="team-card{{ modifier }}">
  <div class="team-card__media">
    {{ image }}
    <span class="team-card__flag">Fictional profile</span>
  </div>
  <div class="team-card__body">
    <h3 class="team-card__name">{{ name }}</h3>
    <p class="team-card__role">{{ role }}</p>
    {{ bio }}
    {{ focus }}
  </div>
</article>
